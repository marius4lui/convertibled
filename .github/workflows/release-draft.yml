name: Prepare accepted release draft
on:
  workflow_dispatch:
    inputs:
      candidate_run:
        description: Successful Product checks run on main containing accepted candidate bytes
        required: true
        type: string
      channel:
        description: Explicit update channel
        type: choice
        options: [stable, preview]
        required: true
      sequence:
        description: New monotonic channel sequence
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: release-delivery
  cancel-in-progress: false
jobs:
  draft:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate_run }}
      CHANNEL: ${{ inputs.channel }}
      SEQUENCE: ${{ inputs.sequence }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require protected environment and successful main candidate
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ && "$SEQUENCE" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '.protection_rules | any(.type == "required_reviewers")' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN" > "$RUNNER_TEMP/source-run.json"
          jq -e '.conclusion == "success" and .head_branch == "main" and .event == "push" and .path == ".github/workflows/checks.yml"' "$RUNNER_TEMP/source-run.json"
          gh run download "$CANDIDATE_RUN" --name fedora44-candidate --dir candidate
          python3 scripts/verify-release-candidate.py candidate/candidate.json "$RUNNER_TEMP/source-run.json"
          source=$(jq -r .commit candidate/candidate.json)
          version=$(jq -r .version candidate/candidate.json)
          git merge-base --is-ancestor "$source" HEAD
          test "$(git rev-parse "refs/tags/v${version}^{commit}")" = "$source"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to replace published or draft assets' >&2
            exit 1
          fi
          python3 scripts/verify-acceptance.py --record "docs/acceptance/$source.json" --commit "$source" --artifact candidate/convertibled-fedora44-x86_64.tar.gz
      - name: Sign metadata with protected release key
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_KEY_ID: ${{ vars.RELEASE_KEY_ID }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_SIGNING_KEY" && test -n "$RELEASE_KEY_ID"
          umask 077
          key="$RUNNER_TEMP/convertibled-release-key.pem"
          trap 'rm -f -- "$key"' EXIT
          printf '%s' "$RELEASE_SIGNING_KEY" > "$key"
          version=$(jq -r .version candidate/candidate.json)
          python3 scripts/release/metadata.py --artifact candidate/convertibled-fedora44-x86_64.tar.gz --url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/convertibled-fedora44-x86_64.tar.gz" --version "$version" --sequence "$SEQUENCE" --channel "$CHANNEL" --notes CHANGELOG.md --output "$RUNNER_TEMP/unsigned-channel.json"
          python3 scripts/release/sign.py --input "$RUNNER_TEMP/unsigned-channel.json" --key "$key" --key-id "$RELEASE_KEY_ID" --output "candidate/$CHANNEL.json"
          cp release/keyring.json candidate/keyring.json
          jq .roots release/trust.json > "$RUNNER_TEMP/roots.json"
          python3 scripts/release/verify.py --directory candidate --roots "$RUNNER_TEMP/roots.json" --channel "$CHANNEL" --repository "$GITHUB_REPOSITORY"
          source=$(jq -r .commit candidate/candidate.json)
          python3 scripts/release/bootstrap.py --commit "$source" --trust release/trust.json --output candidate/convertibled-installer.tar.gz
          (cd candidate && sha256sum convertibled-installer.tar.gz >> SHA256SUMS)
      - name: Create immutable draft for final maintainer review
        shell: bash
        run: |
          set -euo pipefail
          version=$(jq -r .version candidate/candidate.json)
          args=()
          if test "$CHANNEL" = preview; then args+=(--prerelease); fi
          gh release create "v$version" --draft --verify-tag --title "convertibled $version" --notes-file CHANGELOG.md "${args[@]}" candidate/*
