name: Publish accepted release and promote channel
on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact previously prepared accepted release version without v
        required: true
        type: string
      channel:
        description: Explicit channel to promote after public artifact verification
        required: true
        type: choice
        options: [stable, preview]
permissions:
  contents: read
concurrency:
  group: release-delivery
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Require independently approved release environment
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/environments/release" --jq '.protection_rules | any(.type == "required_reviewers")' | grep -qx true
      - name: Verify, publish accepted bytes, and atomically promote
        run: python3 scripts/release/publish.py --version "$VERSION" --channel "$CHANNEL"
