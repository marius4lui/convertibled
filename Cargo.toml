[workspace]
members = ["crates/core", "crates/settings", "crates/daemon", "crates/session", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"

[workspace.dependencies]
convertibled-core = { version = "0.1.0", path = "crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
zbus = "5"
libc = "0.2"
futures-lite = "2"
