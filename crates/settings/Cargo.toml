[package]
name = "convertibled-settings"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { package = "gtk4", version = "0.10", features = ["v4_12"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }

[[bin]]
name = "convertibled-settings"
path = "src/main.rs"
