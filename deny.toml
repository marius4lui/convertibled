[graph]
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "Apache-2.0", "Unicode-3.0", "BSD-3-Clause", "ISC", "Zlib"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
